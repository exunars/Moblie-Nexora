name: tradebot
description: A cross-platform trading application for Android and iOS
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.68.0
  provider: ^6.1.1
  intl: ^0.20.3
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
