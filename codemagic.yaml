# Codemagic CI — builds unsigned IPA for Sideloadly (free Apple ID, no $99 needed)
# Push to main → Codemagic auto-builds → download .ipa from Codemagic artifacts → install via Sideloadly on iPhone
workflows:
  ios-unsigned:
    name: iOS Unsigned (Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Create unsigned IPA for Sideloadly
        script: |
          APP_PATH=$(find build/ios -name "Runner.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Nexora-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Nexora-unsigned.ipa
          echo "IPA ready for Sideloadly"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
